name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 项目面向 Windows 本机值守（toast/taskkill/路径语义），单平台足够。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests (self-contained fixtures, no real repo / no network)
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src demo.py tests
      - name: MCP stdio smoke
        run: python tests/mcp_smoke.py